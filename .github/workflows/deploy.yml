# Deploys the site to Cloudflare Pages (project: frostfingames).
# Pushes to main go to production; other branches get preview URLs.
# Needs the repo secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit).
name: Deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip until the Cloudflare token secret exists
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret not set; skipping deploy."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1a19c4cad08d74f1189e2303f14cf5b3
          command: pages deploy --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}

      - name: Smoke test the deployment
        if: env.HAS_TOKEN == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -eu
          sleep 5
          curl -fsS "$URL/" | grep -q "Frostfin Games"
          curl -fsS -o /dev/null "$URL/play/perfect-pulse/"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/subscribe")" = 405
          echo "::notice::Deployed and verified: $URL"
